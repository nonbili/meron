appId: jp.nonbili.meron
---
- launchApp:
    clearState: false

# The capture profile uses fictional mail from the local test server.
- extendedWaitUntil:
    visible: "Friday lunch at the studio"
    timeout: 60000
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: 01_inbox

# Show the board before the conversation in the store listing.
- tapOn: "Open navigation"
- extendedWaitUntil:
    visible: "Kanban board"
    timeout: 5000
- waitForAnimationToEnd

# Open Kanban board
- tapOn: "Kanban board"
- extendedWaitUntil:
    visible: "Search board"
    timeout: 5000
- waitForAnimationToEnd

- takeScreenshot: 02_kanban

# Back to the inbox to open a conversation.
- tapOn: "Open navigation"
- extendedWaitUntil:
    visible: "Unified inbox"
    timeout: 5000
- tapOn: "Unified inbox"
- waitForAnimationToEnd

- tapOn: "Design review for the spring launch"
- extendedWaitUntil:
    visible: "Write a message..."
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 03_thread
- tapOn: "Back"
- waitForAnimationToEnd

# Capture accounts before opening a populated draft.
- tapOn: "Open navigation"
- waitForAnimationToEnd
- takeScreenshot: 05_accounts
- tapOn: "Unified inbox"

# Open a populated draft in the simulator's mailto handler (Meron).
- openLink: "mailto:mira@example.com?subject=A+few+ideas+for+Friday&body=Hi+Mira%2C%0A%0AI+loved+the+new+illustrations.+The+softer+colors+give+the+whole+page+a+little+more+room+to+breathe.%0A%0ALet%27s+review+the+final+details+on+Friday.%0A%0AElena"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "New message"
    timeout: 15000
- assertVisible: "A few ideas for Friday"
- extendedWaitUntil:
    notVisible: "Loaded compose draft"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 04_compose
