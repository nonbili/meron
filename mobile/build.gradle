plugins {
    id "com.android.application" version "9.2.1" apply false
    id "com.android.library" version "9.2.1" apply false
    id "com.android.kotlin.multiplatform.library" version "9.2.1" apply false
    id "org.jetbrains.kotlin.multiplatform" version "2.4.21" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.21" apply false
    id "org.jetbrains.kotlin.plugin.serialization" version "2.4.21" apply false
    id "org.jetbrains.compose" version "1.12.1" apply false
    id "org.jlleitschuh.gradle.ktlint" version "14.2.0" apply false
}

// Exec looks a bare command up on the PATH the Gradle daemon started with,
// and an idle daemon is reused by builds from any shell, so a daemon started
// without ~/.bun/bin on its PATH fails every later build. Resolve bun here.
ext.bunExecutable = {
    def dirs = (System.getenv("PATH") ?: "").split(File.pathSeparator).toList()
    dirs.add("${System.getProperty("user.home")}/.bun/bin")
    def name = System.getProperty("os.name").toLowerCase().contains("windows") ? "bun.exe" : "bun"
    dirs.collect { new File(it, name) }.find { it.isFile() && it.canExecute() }?.absolutePath ?: "bun"
}()

subprojects {
    apply plugin: "org.jlleitschuh.gradle.ktlint"

    ktlint {
        version.set("1.8.0")
        android.set(true)
        ignoreFailures.set(false)
        additionalEditorconfig.set([
            "ktlint_standard_class-naming": "disabled",
        ])
        filter {
            exclude("**/build/**")
            exclude { element ->
                element.file.path.replace(File.separator, "/").contains("/build/generated/")
            }
        }
    }

    def excludeGeneratedKtlintSources = { task ->
        if (task.name.contains("SourceSet")) {
            task.setSource(fileTree(project.projectDir) {
                include("src/**/*.kt")
            })
        }
    }
    afterEvaluate {
        tasks.withType(org.jlleitschuh.gradle.ktlint.tasks.KtLintCheckTask).configureEach(excludeGeneratedKtlintSources)
        tasks.withType(org.jlleitschuh.gradle.ktlint.tasks.KtLintFormatTask).configureEach(excludeGeneratedKtlintSources)
    }
}
