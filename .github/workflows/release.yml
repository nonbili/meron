name: Build desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            artifact: meron-linux-amd64
            tags: 'embed_sidecar webkit2_41'
          - os: windows-latest
            platform: windows/amd64
            target: x86_64-pc-windows-msvc
            artifact: meron-windows-amd64
            tags: 'embed_sidecar'
          - os: macos-15-intel
            platform: darwin/amd64
            target: x86_64-apple-darwin
            artifact: meron-darwin-amd64
            tags: 'embed_sidecar'
          - os: macos-15
            platform: darwin/arm64
            target: aarch64-apple-darwin
            artifact: meron-darwin-arm64
            tags: 'embed_sidecar'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: desktop/go.sum

      - uses: oven-sh/setup-bun@v2

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meron-core

      - name: install linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            pkg-config \
            libfuse2 \
            perl
          # `perl` (full, not perl-base) is required by openssl-src, which builds
          # the vendored OpenSSL pulled in via rusqlite's
          # bundled-sqlcipher-vendored-openssl feature. Its Configure script needs
          # core modules like FindBin, IPC::Cmd and Time::Piece.

      - name: install wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: use Strawberry Perl for vendored OpenSSL on Windows
        if: startsWith(matrix.os, 'windows')
        shell: bash
        # The sidecar build runs under Git bash, whose /usr/bin perl is a stripped
        # MSYS build that lacks core modules (Locale::Maketext::Simple) needed by
        # openssl-src's Configure script. Point openssl-src at the runner's full
        # Strawberry Perl instead.
        run: echo 'OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe' >> "$GITHUB_ENV"

      - name: build and stage sidecar
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path meron-core/Cargo.toml --target ${{ matrix.target }}
          mkdir -p desktop/build/sidecar
          SRC="meron-core/target/${{ matrix.target }}/release/meron-core"
          if [ -f "$SRC.exe" ]; then SRC="$SRC.exe"; fi
          if [[ "${{ matrix.os }}" == ubuntu* ]]; then
            strip --strip-unneeded "$SRC"
          fi
          # The go:embed directive expects desktop/build/sidecar/meron-core (no extension)
          # on every platform; extension handling is the app's concern at runtime.
          cp "$SRC" desktop/build/sidecar/meron-core

      # ---------------------------------------------------------------- macOS
      - name: import mac signing cert
        if: startsWith(matrix.os, 'macos')
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "CSC_LINK not set — skipping signing cert import"
            exit 0
          fi
          CERTIFICATE_P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          case "$CSC_LINK" in
            http://*|https://*) curl -fsSL "$CSC_LINK" -o "$CERTIFICATE_P12" ;;
            file://*)           cp "${CSC_LINK#file://}" "$CERTIFICATE_P12" ;;
            *)                  printf '%s' "$CSC_LINK" | base64 -D > "$CERTIFICATE_P12" ;;
          esac

          security import "$CERTIFICATE_P12" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: install NSIS
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          # choco updates the machine PATH, but the running job won't pick that up
          # in later steps; expose makensis to the build step explicitly.
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: build wails app
        shell: bash
        run: |
          set -euo pipefail
          # -nsis produces a traditional installer (Start-menu shortcut,
          # uninstaller, mailto protocol registration) alongside the portable
          # exe; it is only valid on Windows.
          extra=""
          if [[ "${{ matrix.os }}" == windows* ]]; then extra="-nsis"; fi
          cd desktop
          wails build -clean -platform ${{ matrix.platform }} -tags "${{ matrix.tags }}" $extra

      - name: package macOS dmg
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP_PATH="desktop/build/bin/meron.app"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG_PATH="dist/${{ matrix.artifact }}.dmg"
          mkdir -p dist
          rm -rf "$DMG_ROOT" && mkdir -p "$DMG_ROOT"

          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -n "${TEAM_ID:-}" ]; then
            SIGNING_IDENTITY="Developer ID Application: Nonbili Inc. ($TEAM_ID)"
            codesign --force --options runtime --timestamp --deep \
              --entitlements desktop/build/darwin/Entitlements.plist \
              --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" "$APP_PATH"
            codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          else
            echo "::warning::macOS signing secrets not set — producing an unsigned DMG"
          fi

          ditto "$APP_PATH" "$DMG_ROOT/Meron.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "Meron" -srcfolder "$DMG_ROOT" -ov -format UDZO "$DMG_PATH"

          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -n "${TEAM_ID:-}" ]; then
            SIGNING_IDENTITY="Developer ID Application: Nonbili Inc. ($TEAM_ID)"
            codesign --force --timestamp --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" "$DMG_PATH"
            codesign --verify --verbose=4 "$DMG_PATH"
            if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
              xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$TEAM_ID" --wait
              xcrun stapler staple "$DMG_PATH"
              xcrun stapler validate "$DMG_PATH"
            else
              echo "::warning::notarization secrets not set — skipping notarization"
            fi
          fi

      # ---------------------------------------------------------------- Linux
      - name: package linux tarball
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C desktop/build/bin -czf "dist/${{ matrix.artifact }}.tar.gz" meron

      - name: resize appicon for Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          convert desktop/build/appicon.png -resize 512x512 desktop/build/appicon_512.png

      - name: package linux AppImage
        if: startsWith(matrix.os, 'ubuntu')
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_OUTPUT: dist/${{ matrix.artifact }}.AppImage
          # Embedding update information makes the AppImage self-describing for
          # AppImageUpdate, AppImageLauncher, AM and friends, and makes
          # appimagetool emit the matching .zsync file so those tools can pull
          # only the changed blocks. The pattern is matched against the assets
          # of whatever release carries the `latest` pointer, which the release
          # job always keeps on the newest desktop tag.
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|${{ matrix.artifact }}.AppImage.zsync
        run: |
          set -euo pipefail
          mkdir -p dist
          base="https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous"
          aibase="https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous"
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-appimage "$aibase/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp desktop/build/bin/meron AppDir/usr/bin/meron
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/meron \
            --desktop-file desktop/build/linux/meron.desktop \
            --icon-file desktop/build/appicon_512.png \
            --icon-filename meron

          # Ship no libraries: the app uses the host's GTK and WebKit.
          #
          # A bundled libwebkit2gtk cannot work off Debian/Ubuntu. It spawns its
          # helper processes (WebKitNetworkProcess et al) from a path compiled
          # into the library — /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1 here —
          # and distro builds compile out the WEBKIT_EXEC_PATH override, so on
          # e.g. Fedora it aborts with "Failed to spawn child process".
          #
          # Keeping the GTK/glib stack while dropping only WebKit is worse: the
          # host WebKit would resolve glib against the older bundled copy and
          # die on missing symbols. So the AppImage carries just the binary and
          # requires webkit2gtk-4.1 on the host (documented in the README),
          # which every distro that can run the tarball already provides.
          rm -rf AppDir/usr/lib && mkdir -p AppDir/usr/lib

          # linuxdeploy re-resolves dependencies whenever it touches an AppDir,
          # so package via the plugin directly to keep usr/lib empty.
          ./linuxdeploy-plugin-appimage --appdir AppDir

          # appimagetool drops the .zsync in the working directory rather than
          # beside the image, so move it into dist/ to get it released next to
          # the AppImage — the zsync's URL header is a bare filename, resolved
          # relative to wherever the .zsync itself was fetched from.
          zsync="dist/${{ matrix.artifact }}.AppImage.zsync"
          if [ ! -f "$zsync" ]; then
            stray=$(ls ./*.AppImage.zsync 2>/dev/null | head -1 || true)
            if [ -z "$stray" ]; then
              echo "AppImage built without a .zsync file — update information was not embedded" >&2
              exit 1
            fi
            mv "$stray" "$zsync"
          fi

      - name: stage snap payload
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p snap/local
          cp desktop/build/bin/meron snap/local/meron
          cp desktop/build/linux/meron.desktop snap/local/meron.desktop
          cp desktop/build/appicon_512.png snap/local/meron.png

      - name: package linux snap
        if: startsWith(matrix.os, 'ubuntu')
        uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: .

      - name: stage snap artifact
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" "dist/${{ matrix.artifact }}.snap"

      # -------------------------------------------------------------- Windows
      - name: package windows zip
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          7z a "dist/${{ matrix.artifact }}-portable.zip" ./desktop/build/bin/meron.exe

      - name: stage windows installer
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # wails -nsis emits desktop/build/bin/<name>-<arch>-installer.exe
          installer=$(ls desktop/build/bin/*installer.exe)
          cp "$installer" "dist/${{ matrix.artifact }}.exe"

      - name: package windows appx
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        env:
          APPX_CERT: ${{ secrets.WINDOWS_APPX_CERT }}
          APPX_CERT_PASSWORD: ${{ secrets.WINDOWS_APPX_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $version = (Get-Content desktop/wails.json -Raw | ConvertFrom-Json).info.productVersion
          $appxVersion = "$version.0"

          # Stage the package payload.
          $stage = Join-Path $env:RUNNER_TEMP 'appx'
          $assets = Join-Path $stage 'Assets'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item desktop/build/bin/meron.exe (Join-Path $stage 'meron.exe')

          # Generate the tile/logo assets from the 1024px app icon.
          choco install imagemagick.app --no-progress -y | Out-Null
          $magick = "magick"
          $sizes = @{
            'Square44x44Logo.png'   = '44x44';
            'Square71x71Logo.png'   = '71x71';
            'Square150x150Logo.png' = '150x150';
            'Square310x310Logo.png' = '310x310';
            'StoreLogo.png'         = '50x50';
          }
          foreach ($name in $sizes.Keys) {
            & $magick desktop/build/appicon.png -resize $sizes[$name] (Join-Path $assets $name)
          }
          # Wide tile: fit the icon centered on a transparent 310x150 canvas.
          & $magick desktop/build/appicon.png -resize 150x150 -background none -gravity center -extent 310x150 (Join-Path $assets 'Wide310x150Logo.png')

          # Stamp the version into the manifest (Publisher must match the signing
          # cert subject; override it in desktop/build/windows/appx/AppxManifest.xml or via
          # signtool's cert when signing for a real Store/sideload identity).
          [xml]$m = Get-Content desktop/build/windows/appx/AppxManifest.xml
          $m.Package.Identity.Version = $appxVersion
          $m.Save((Join-Path $stage 'AppxManifest.xml'))

          # Locate the Windows SDK tools.
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10\bin'
          $sdkBin = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $makeappx = Join-Path $sdkBin.FullName 'x64\makeappx.exe'
          $signtool = Join-Path $sdkBin.FullName 'x64\signtool.exe'

          $appx = "dist/${{ matrix.artifact }}.appx"
          & $makeappx pack /d $stage /p $appx /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }

          if ($env:APPX_CERT) {
            $pfx = Join-Path $env:RUNNER_TEMP 'appx-cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:APPX_CERT))
            & $signtool sign /fd SHA256 /a /f $pfx /p $env:APPX_CERT_PASSWORD $appx
            if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          } else {
            Write-Host "::warning::WINDOWS_APPX_CERT not set — producing an unsigned .appx (Store re-signs on submission; sideloading requires a trusted signature)"
          }

      # --------------------------------------------------------------- upload
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: resolve tag
        run: |
          set -euo pipefail
          VER=$(jq -r '.info.productVersion' desktop/wails.json)
          WAILS_TAG="v$VER"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=$WAILS_TAG" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_REF_NAME" != "$WAILS_TAG" ]; then
              echo "Tag $GITHUB_REF_NAME does not match desktop/wails.json version $WAILS_TAG."
              exit 1
            fi
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi

      - name: prepare release note
        run: |
          set -euo pipefail
          VER=$(jq -r '.info.productVersion' desktop/wails.json)
          sed "s/{VER}/$VER/g" metadata/changelogs/template.txt > note.txt
          printf '\n' >> note.txt
          cat metadata/changelogs/v$VER.txt >> note.txt

      # The in-app updater reads this manifest from the immutable
      # releases/latest/download/latest.json redirect; it must be generated
      # before the release step so `files: dist/*` uploads it.
      - name: generate update manifest
        run: |
          set -euo pipefail
          VER=$(jq -r '.info.productVersion' desktop/wails.json)
          scripts/gen-latest-json.sh "$VER" \
            "https://github.com/${{ github.repository }}/releases/download/v$VER" \
            dist > dist/latest.json
          cat dist/latest.json

      - name: publish snap
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: dist/meron-linux-amd64.snap
          release: stable

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # The updater's manifest lives behind releases/latest/download/, so a
          # desktop release must always own the latest pointer.
          make_latest: true
          body_path: note.txt
          generate_release_notes: true
          files: dist/*
